{{- /*
onuc Service (spec §11). Port compose ile aynı: 3000.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kutyai.bilesenAdi" (dict "kok" $ "bilesen" "onuc") }}
  namespace: {{ include "kutyai.namespace" . }}
  labels:
    {{- include "kutyai.etiketler" (dict "kok" $ "bilesen" "onuc") | nindent 4 }}
  {{- with .Values.onuc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.onuc.service.type }}
  ports:
    - name: http
      port: {{ .Values.onuc.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kutyai.seciciler" (dict "kok" $ "bilesen" "onuc") | nindent 4 }}
