{{- /*
arka.uc Service (spec §11). Port compose ile aynı: 8000.
Nginx öneki yoktur; Ingress /api yolunu değiştirmeden bu servise yollar
(dagitim/nginx.conf ile aynı davranış).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kutyai.bilesenAdi" (dict "kok" $ "bilesen" "arka-uc") }}
  namespace: {{ include "kutyai.namespace" . }}
  labels:
    {{- include "kutyai.etiketler" (dict "kok" $ "bilesen" "arka-uc") | nindent 4 }}
  {{- with .Values.arkauc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.arkauc.service.type }}
  ports:
    - name: http
      port: {{ .Values.arkauc.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kutyai.seciciler" (dict "kok" $ "bilesen" "arka-uc") | nindent 4 }}
