{{- /*
Sırlar (spec §11). İki mod:
  1) secrets.existingSecret dolu -> bu şablon HİÇBİR ŞEY üretmez; pod'lar
     `envFrom.secretRef` ile o Secret'ı okur (üretimde önerilen).
  2) secrets.create (varsayılan) -> Secret burada üretilir. Değerler
     `secrets.values` altında KUTYAI_* adlarıyla verilir. İki anahtar boş
     bırakılırsa RASTGELE üretilir:
       KUTYAI_GIZLI_ANAHTAR        -> 64 karakter (JWT/imza anahtarı)
       KUTYAI_SIFRELEME_ANAHTARI   -> Fernet anahtarı (32 bayt, urlsafe base64)
     Üretilen değerler yükseltmede `lookup` ile KORUNUR (şifreli veri açılamaz
     hale gelmesin diye). `helm template` (küme yokken) her çalıştırmada yeni
     değer üretir; bu yalnızca yerel doğrulamayı etkiler.
*/ -}}
{{- if and (not .Values.secrets.create) (not .Values.secrets.existingSecret) }}
{{- fail "Sır kaynağı tanımsız: ya secrets.create=true (chart Secret üretir) ya da secrets.existingSecret=<ad> verilmelidir." }}
{{- end }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if not .Values.secrets.values }}
{{- fail "secrets.create=true ama secrets.values boş: sır kaynağı tanımsız." }}
{{- end }}
{{- $ns := include "kutyai.namespace" . }}
{{- $ad := include "kutyai.tamAd" . }}
{{- $gizli := .Values.secrets.values.KUTYAI_GIZLI_ANAHTAR }}
{{- if not $gizli }}
{{- $gizli = include "kutyai.mevcutSir" (dict "ns" $ns "ad" $ad "anahtar" "KUTYAI_GIZLI_ANAHTAR") }}
{{- end }}
{{- if not $gizli }}
{{- $gizli = randAlphaNum 64 }}
{{- end }}
{{- $sifreleme := .Values.secrets.values.KUTYAI_SIFRELEME_ANAHTARI }}
{{- if not $sifreleme }}
{{- $sifreleme = include "kutyai.mevcutSir" (dict "ns" $ns "ad" $ad "anahtar" "KUTYAI_SIFRELEME_ANAHTARI") }}
{{- end }}
{{- if not $sifreleme }}
{{- /* Fernet: 32 rastgele baytın urlsafe base64 kodlaması (32 ASCII karakter -> 32 bayt). */}}
{{- $sifreleme = (randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ad }}
  namespace: {{ $ns }}
  labels:
    {{- include "kutyai.etiketler" (dict "kok" $ "bilesen" "yapilandirma") | nindent 4 }}
type: Opaque
data:
  KUTYAI_GIZLI_ANAHTAR: {{ $gizli | b64enc | quote }}
  KUTYAI_SIFRELEME_ANAHTARI: {{ $sifreleme | b64enc | quote }}
  {{- range $anahtar, $deger := (omit .Values.secrets.values "KUTYAI_GIZLI_ANAHTAR" "KUTYAI_SIFRELEME_ANAHTARI") }}
  {{- if $deger }}
  {{ $anahtar }}: {{ $deger | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
