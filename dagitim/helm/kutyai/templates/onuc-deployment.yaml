{{- /*
onuc Deployment (spec §11). Compose karşılığı: docker-compose.yml `onuc` servisi.
Aynı port (3000), aynı sağlık kontrolü (kök yol "/"), aynı ortam değişkenleri:
  NEXT_PUBLIC_API_URL = tarayıcıdan görünen API adresi (browserApiUrl)
  PORT                = 3000
Kalıcı hacim yoktur (durumsuz arayüz).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kutyai.bilesenAdi" (dict "kok" $ "bilesen" "onuc") }}
  namespace: {{ include "kutyai.namespace" . }}
  labels:
    {{- include "kutyai.etiketler" (dict "kok" $ "bilesen" "onuc") | nindent 4 }}
spec:
  replicas: {{ .Values.onuc.replicaCount }}
  selector:
    matchLabels:
      {{- include "kutyai.seciciler" (dict "kok" $ "bilesen" "onuc") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kutyai.etiketler" (dict "kok" $ "bilesen" "onuc") | nindent 8 }}
      {{- with .Values.onuc.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "kutyai.serviceAccountAd" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if .Values.onuc.securityContext.runAsNonRoot }}
        runAsNonRoot: true
        {{- end }}
        {{- with .Values.onuc.securityContext.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .Values.onuc.securityContext.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with .Values.onuc.securityContext.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: onuc
          image: {{ include "kutyai.imaj" (dict "repository" .Values.onuc.image.repository "tag" .Values.onuc.image.tag "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.onuc.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.onuc.containerPort }}
              protocol: TCP
          env:
            # DERLEME ANI: NEXT_PUBLIC_* değeri istemci paketine gömülür; imaj bu
            # adresle derlenmelidir (dagitim/Dockerfile.onuc, ARG NEXT_PUBLIC_API_URL).
            - name: NEXT_PUBLIC_API_URL
              value: {{ default .Values.browserApiUrl .Values.onuc.browserApiUrl | quote }}
            - name: PORT
              value: {{ .Values.onuc.containerPort | quote }}
            {{- with .Values.onuc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.onuc.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.onuc.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.onuc.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.onuc.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.onuc.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.onuc.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.onuc.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.onuc.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.onuc.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.onuc.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.onuc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.onuc.securityContext.dropAllCapabilities }}
            capabilities:
              drop:
                - ALL
            {{- end }}
            readOnlyRootFilesystem: {{ .Values.onuc.securityContext.readOnlyRootFilesystem }}
      {{- with .Values.onuc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.onuc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.onuc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
