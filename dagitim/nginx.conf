# KutyAI — nginx tek giris noktasi (OPSIYONEL).
#
# docker compose --profile nginx up -d   ->  http://localhost:8080
#
# Yonlendirme:
#   /api/   -> arkauc:8000        (yol KORUNUR: /api/v1/saglik -> arkauc /api/v1/saglik)
#   /panel/ -> yonetim_paneli:3001 (onek KIRPILIR: /panel/bdm -> /bdm)
#   /      -> onuc:3000
#
# NOT (panel oneki): yonetim_paneli `basePath` ile derlenmedigi icin urettigi HTML
# varlik yollarini (/_next/...) kokten ister. Bu nedenle `/panel/` altindan servis
# etmek sayfalari acar ama statik varliklari kirar. Panel icin onerilen kurulum
# ayri bir alan adi/porttur (varsayilan: http://localhost:3001). Alan adiyla tek
# giris noktasi kurmak isterseniz asagidaki `server` blogunu kullanin.

upstream kutyai_arka.uc {
  server arkauc:8000;
}
upstream kutyai_onuc {
  server onuc:3000;
}
upstream kutyai_panel {
  server yonetim_paneli:3001;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 8m;
  # SSE (sohbet akisi, hazirlama ilerlemesi) icin tamponlama kapali olmali.
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # --- API ---
  location /api/ {
    proxy_pass http://kutyai_arka.uc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # --- Son kullanici arayuzu ---
  location / {
    proxy_pass http://kutyai_onuc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # --- Yonetim paneli (onek kirpilir) ---
  location /panel/ {
    proxy_pass http://kutyai_panel/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

